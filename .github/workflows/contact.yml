name: "Contact form via GitHub Pages"

on:
  repository_dispatch:
    types: [contact_form_submission]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  create_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Ignore bot submissions
        if: ${{ github.event.client_payload.name == '' || github.event.client_payload.email == '' || github.event.client_payload.message == '' }}
        run: echo "Missing fields, skipping."

      - name: Create an issue for the message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ github.event.client_payload.name }}
          EMAIL: ${{ github.event.client_payload.email }}
          MESSAGE: ${{ github.event.client_payload.message }}
        run: |
          gh api repos/${{ github.repository }}/issues \
            -f title="Message from $NAME" \
            -f body="**Email:** $EMAIL  

$MESSAGE" \
            -f labels='contact-form'
